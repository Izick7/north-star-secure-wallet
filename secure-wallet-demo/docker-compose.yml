services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_dev_only
    ports:
      - "5432:5432"
    volumes:
      - wallet_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://wallet:wallet_dev_only@db:5432/wallet
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret-at-least-32-characters}
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: /api
      VITE_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    ports:
      - "5173:5173"
volumes:
  wallet_db:
